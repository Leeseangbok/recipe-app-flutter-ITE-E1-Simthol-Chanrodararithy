name: recipe_finder_flutter_app
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.7
  flutter_riverpod: ^3.0.3
  http: ^1.6.0
  go_router: ^17.0.0
  retrofit: ^4.9.1
  shimmer_animation: ^2.2.2+1
  dio: ^5.9.0
  dio_http_formatter: ^3.3.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  sqflite: ^2.3.0
  path: ^1.9.0
  url_launcher: ^6.0.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.11
  retrofit_generator: ^10.0.0
  json_serializable: ^6.8.0
  freezed: ^3.2.3
  riverpod_generator: ^3.0.3
  custom_lint: ^0.8.0
  riverpod_lint: ^3.0.3
  flutter_launcher_icons: ^0.14.1 

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/logo.jpg
  android_12:
    image: assets/images/logo.jpg
    color: "#ffffff"
  web: false

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.jpg"
  min_sdk_android: 21
  
flutter:
  uses-material-design: true

  assets:
    - assets/images/
